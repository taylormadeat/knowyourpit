name: Submit iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'IPA download URL (from EAS build artifacts)'
        required: true
        default: 'https://expo.dev/artifacts/eas/05GszWoPE93NPsuNFEDcL9XK-Sx4oqwNQJg_ND4lnGU.ipa'

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download IPA
        run: |
          echo "Downloading IPA from EAS..."
          curl -L "${{ github.event.inputs.ipa_url }}" -o app.ipa
          ls -lh app.ipa

      # The key is stored as base64(properly-formatted PEM) in ASC_API_KEY_P8_B64.
      # Base64 contains no dashes, so GitHub never masks '-----' or any flag.
      # Decoding it gives a ready-to-use multi-line PEM — no parsing needed.
      - name: Install ASC API Key
        env:
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          python3 -c "
          import base64, os
          pem = base64.b64decode(os.environ['ASC_API_KEY_P8_B64'])
          key_id = os.environ['ASC_API_KEY_ID']
          path = os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8')
          open(path, 'wb').write(pem)
          print('Key written:', path)
          "

      - name: Upload to TestFlight via altool
        id: altool
        continue-on-error: true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file app.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose

      - name: Upload to TestFlight via fastlane (fallback)
        if: steps.altool.outcome == 'failure'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          gem install fastlane --no-document -q
          fastlane pilot upload \
            --ipa app.ipa \
            --api_key_path ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            --api_key_id "$ASC_API_KEY_ID" \
            --api_key_issuer_id "$ASC_API_ISSUER_ID" \
            --skip_waiting_for_build_processing true \
            --verbose
