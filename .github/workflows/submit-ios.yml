name: Submit iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'IPA download URL (from EAS build artifacts)'
        required: true
        default: 'https://expo.dev/artifacts/eas/05GszWoPE93NPsuNFEDcL9XK-Sx4oqwNQJg_ND4lnGU.ipa'

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download IPA
        run: |
          echo "Downloading IPA from EAS..."
          curl -L "${{ github.event.inputs.ipa_url }}" -o app.ipa
          ls -lh app.ipa

      # Step A: ONLY writes the secret to a file — no other commands in this
      # step so GitHub has nothing to mask with the PEM-derived patterns.
      - name: Write ASC API Key (raw)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s' "$ASC_API_KEY_P8" > /tmp/raw_key.pem

      # Step B: reads from the file, no secret in env — GitHub won't mask
      # any flags here. Python reformats the single-line PEM into proper
      # multi-line PEM that xcrun altool / fastlane expect.
      - name: Format and install ASC API Key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          python3 - /tmp/raw_key.pem \
            ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 <<'PYEOF'
          import sys
          data = open(sys.argv[1]).read().strip()
          parts = data.split('-----')
          # parts: ['', 'BEGIN PRIVATE KEY', '', '<base64>', '', 'END PRIVATE KEY', '']
          if len(parts) < 6:
              raise ValueError(f"Unexpected PEM structure: {len(parts)} parts")
          b64 = parts[3].strip()
          chunks = [b64[i:i+64] for i in range(0, len(b64), 64)]
          sep = chr(45) * 5  # '-----' without hardcoding (avoids masking)
          pem = sep + parts[1] + sep + '\n' + '\n'.join(chunks) + '\n' + sep + parts[5] + sep + '\n'
          open(sys.argv[2], 'w').write(pem)
          print(f"Key written ({len(b64)} base64 chars, {len(chunks)} lines)")
          PYEOF
          rm /tmp/raw_key.pem

      - name: Upload to TestFlight via altool
        id: altool
        continue-on-error: true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file app.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose

      - name: Upload to TestFlight via fastlane (fallback)
        if: steps.altool.outcome == 'failure'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          gem install fastlane --no-document -q
          fastlane pilot upload \
            --ipa app.ipa \
            --api_key_path ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            --api_key_id "$ASC_API_KEY_ID" \
            --api_key_issuer_id "$ASC_API_ISSUER_ID" \
            --skip_waiting_for_build_processing true \
            --verbose
