name: Submit iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'IPA download URL (from EAS build artifacts)'
        required: true
        default: 'https://expo.dev/artifacts/eas/05GszWoPE93NPsuNFEDcL9XK-Sx4oqwNQJg_ND4lnGU.ipa'

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download IPA
        run: |
          echo "Downloading IPA from EAS..."
          curl -L "${{ github.event.inputs.ipa_url }}" -o app.ipa
          ls -lh app.ipa

      # The key is stored as base64(properly-formatted PEM) in ASC_API_KEY_P8_B64.
      # Base64 contains no dashes, so GitHub never masks '-----' or any flag.
      # Decoding it gives a ready-to-use multi-line PEM — no parsing needed.
      - name: Install ASC API Key
        env:
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          python3 -c "
          import base64, os
          pem = base64.b64decode(os.environ['ASC_API_KEY_P8_B64'])
          key_id = os.environ['ASC_API_KEY_ID']
          path = os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8')
          open(path, 'wb').write(pem)
          print('Key written:', path)
          "

      # Use Python subprocess so the '--' flags are passed as a list directly
      # to the process — GitHub's shell-level secret masking can't touch them.
      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, os, sys

          key_id    = os.environ.get('ASC_API_KEY_ID', '')
          issuer_id = os.environ.get('ASC_API_ISSUER_ID', '')

          print(f"key_id length:    {len(key_id)}")
          print(f"issuer_id length: {len(issuer_id)}")

          if not key_id or not issuer_id:
              print("ERROR: key_id or issuer_id is empty")
              sys.exit(1)

          # Build arg list — bypasses shell masking entirely
          cmd = [
              'xcrun', 'altool',
              '--upload-app',
              '--type', 'ios',
              '--file', 'app.ipa',
              '--apiKey', key_id,
              '--apiIssuer', issuer_id,
              '--verbose',
          ]

          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          PYEOF
