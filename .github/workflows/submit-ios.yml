name: Submit iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'IPA download URL (from EAS build artifacts)'
        required: true
        default: 'https://expo.dev/artifacts/eas/05GszWoPE93NPsuNFEDcL9XK-Sx4oqwNQJg_ND4lnGU.ipa'

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Download IPA
        run: |
          echo "Downloading IPA from EAS..."
          curl -L "${{ github.event.inputs.ipa_url }}" -o app.ipa
          ls -lh app.ipa

      - name: Write ASC API Key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # Write raw value to temp file then let openssl reformat it.
          # Avoids embedding any PEM header strings in the script (GitHub
          # would mask them, breaking the parse).
          printf '%s' "$ASC_API_KEY_P8" > /tmp/raw_key.pem
          openssl pkey -in /tmp/raw_key.pem \
            -out ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          rm /tmp/raw_key.pem
          echo "Key written"

      - name: Upload to TestFlight via altool
        id: altool
        continue-on-error: true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file app.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose

      - name: Upload to TestFlight via fastlane (fallback)
        if: steps.altool.outcome == 'failure'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          gem install fastlane --no-document -q
          fastlane pilot upload \
            --ipa app.ipa \
            --api_key_path ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            --api_key_id "$ASC_API_KEY_ID" \
            --api_key_issuer_id "$ASC_API_ISSUER_ID" \
            --skip_waiting_for_build_processing true \
            --verbose
