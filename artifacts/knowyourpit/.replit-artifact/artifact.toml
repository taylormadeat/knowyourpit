kind = "mobile"
previewPath = "/knowyourpit/"
title = "KnowYourPit Mobile"
version = "1.0.0"
id = "artifacts/knowyourpit"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/knowyourpit/" ]
localPort = 19876

[services.development]
run = "pnpm --filter @workspace/knowyourpit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knowyourpit", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/knowyourpit", "run", "serve" ]

[services.env]
PORT = "19876"
BASE_PATH = "/knowyourpit/"
