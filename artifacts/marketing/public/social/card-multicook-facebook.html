<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0E0E10;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; align-items: stretch;
    position: relative;
  }

  .glow-right {
    position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
    width: 480px; height: 400px;
    background: radial-gradient(ellipse at 80% 50%, rgba(211,100,45,0.2) 0%, rgba(167,40,49,0.07) 45%, transparent 70%);
    pointer-events: none;
  }
  .glow-left {
    position: absolute; left: -60px; top: -60px;
    width: 380px; height: 340px;
    background: radial-gradient(ellipse at 20% 20%, rgba(211,100,45,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── Left column ── */
  .left {
    width: 460px; flex-shrink: 0;
    display: flex; flex-direction: column;
    padding: 52px 52px 52px 68px;
    position: relative; z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-icon { width: 30px; height: 30px; object-fit: contain; }
  .brand-name { font-size: 14px; font-weight: 600; color: rgba(244,241,234,0.52); letter-spacing: -0.01em; }
  .brand-name span { color: #D3642D; }

  .copy { margin-top: 36px; flex: 1; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #D3642D; margin-bottom: 14px; }
  .headline { font-size: 54px; font-weight: 700; line-height: 1.06; letter-spacing: -0.03em; color: #F4F1EA; }
  .headline .accent { color: #D3642D; }
  .sub { font-size: 16px; font-weight: 400; color: rgba(244,241,234,0.42); margin-top: 16px; line-height: 1.55; }

  .tagline { font-size: 14px; font-weight: 400; color: rgba(244,241,234,0.32); flex-shrink: 0; margin-top: auto; }
  .tagline strong { font-weight: 600; color: rgba(244,241,234,0.48); }

  /* divider */
  .divider {
    width: 1px; flex-shrink: 0;
    background: linear-gradient(180deg, transparent 5%, rgba(244,241,234,0.07) 25%, rgba(244,241,234,0.07) 75%, transparent 95%);
    position: relative; z-index: 1;
  }

  /* ── Right column ── */
  .right {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 52px 68px 52px 52px;
    position: relative; z-index: 1;
    gap: 32px;
  }

  .timeline-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(244,241,234,0.22); font-family: 'JetBrains Mono', monospace;
    flex-shrink: 0;
  }

  .timeline { position: relative; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }

  .serve-line {
    position: absolute; right: 0; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(180deg, transparent 2%, rgba(211,100,45,0.55) 10%, rgba(211,100,45,0.55) 90%, transparent 98%);
  }
  .serve-label {
    position: absolute; right: 0; top: -22px; transform: translateX(50%);
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: #D3642D; font-family: 'JetBrains Mono', monospace; white-space: nowrap;
  }

  .cook-row { display: flex; align-items: center; }
  .cook-label {
    width: 80px; flex-shrink: 0;
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(244,241,234,0.38); font-family: 'JetBrains Mono', monospace;
    text-align: right; padding-right: 14px;
  }
  .bar-track { flex: 1; height: 52px; position: relative; display: flex; align-items: center; }
  .bar-spacer { flex-shrink: 0; }
  .bar-fill {
    flex: 1; height: 52px; border-radius: 5px;
    position: relative; display: flex; align-items: center; padding-right: 50px;
  }
  .bar-brisket .bar-fill {
    background: linear-gradient(90deg, rgba(167,40,49,0.48) 0%, rgba(193,73,49,0.72) 50%, rgba(211,100,45,0.9) 100%);
  }
  .bar-ribs .bar-fill {
    background: linear-gradient(90deg, rgba(193,73,49,0.3) 0%, rgba(211,100,45,0.62) 100%);
  }
  .bar-chicken .bar-fill {
    background: linear-gradient(90deg, rgba(211,100,45,0.17) 0%, rgba(211,100,45,0.48) 100%);
  }
  .bar-temp {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500;
    color: rgba(244,241,234,0.55); background: #0E0E10; padding: 2px 0 2px 8px;
  }
  .bar-dot {
    position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: #D3642D; box-shadow: 0 0 10px rgba(211,100,45,0.65); z-index: 2;
  }
  .cook-duration {
    width: 44px; flex-shrink: 0; padding-left: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: rgba(244,241,234,0.22); white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <div class="left">
    <div class="brand">
      <img class="brand-icon" src="../icon-transparent-light.png" alt="">
      <span class="brand-name">know<span>your</span>pit</span>
    </div>
    <div class="copy">
      <p class="eyebrow">Multi-Cook</p>
      <h1 class="headline">brisket, ribs,<br>chicken.<br><span class="accent">all at once.</span></h1>
      <p class="sub">Set one serve time. It works backwards and tells you exactly when each cut goes on the pit.</p>
    </div>
    <span class="tagline"><strong>knowyourpit.</strong> own your cook.</span>
  </div>

  <div class="divider"></div>

  <div class="right">
    <p class="timeline-label">cook schedule</p>
    <div class="timeline">
      <div class="serve-line"></div>
      <span class="serve-label">serve</span>

      <div class="cook-row bar-brisket">
        <span class="cook-label">Brisket</span>
        <div class="bar-track">
          <div class="bar-spacer" style="width:0%"></div>
          <div class="bar-fill">
            <span class="bar-temp">203°F</span>
            <div class="bar-dot"></div>
          </div>
        </div>
        <span class="cook-duration">12 h</span>
      </div>

      <div class="cook-row bar-ribs">
        <span class="cook-label">Ribs</span>
        <div class="bar-track">
          <div class="bar-spacer" style="width:58.3%"></div>
          <div class="bar-fill">
            <span class="bar-temp">195°F</span>
            <div class="bar-dot"></div>
          </div>
        </div>
        <span class="cook-duration">5 h</span>
      </div>

      <div class="cook-row bar-chicken">
        <span class="cook-label">Chicken</span>
        <div class="bar-track">
          <div class="bar-spacer" style="width:75%"></div>
          <div class="bar-fill">
            <span class="bar-temp">165°F</span>
            <div class="bar-dot"></div>
          </div>
        </div>
        <span class="cook-duration">3 h</span>
      </div>
    </div>
  </div>
</body>
</html>
