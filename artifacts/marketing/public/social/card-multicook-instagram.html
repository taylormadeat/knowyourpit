<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #0E0E10;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; flex-direction: column;
    padding: 68px 76px 64px;
    position: relative;
  }

  .glow-serve {
    position: absolute; right: -40px; top: 58%; transform: translateY(-50%);
    width: 440px; height: 440px;
    background: radial-gradient(ellipse at 80% 50%, rgba(211,100,45,0.22) 0%, rgba(167,40,49,0.07) 45%, transparent 70%);
    pointer-events: none;
  }
  .glow-top {
    position: absolute; left: -80px; top: -80px;
    width: 480px; height: 360px;
    background: radial-gradient(ellipse at 20% 20%, rgba(211,100,45,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── Header ── */
  .top { position: relative; z-index: 1; flex-shrink: 0; }

  .eyebrow {
    font-size: 15px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: #D3642D; margin-bottom: 16px;
  }
  .headline {
    font-size: 82px; font-weight: 700; line-height: 1.04;
    letter-spacing: -0.03em; color: #F4F1EA;
  }
  .headline .accent { color: #D3642D; }
  .sub {
    font-size: 24px; font-weight: 400; color: rgba(244,241,234,0.45);
    margin-top: 20px; line-height: 1.45; max-width: 820px;
  }

  /* ── Timeline ── */
  .timeline {
    position: relative; z-index: 1;
    margin-top: 44px; flex-shrink: 0;
  }

  .serve-line {
    position: absolute; right: 0; top: -4px; bottom: 0; width: 1px;
    background: linear-gradient(180deg, rgba(211,100,45,0.55) 0%, rgba(211,100,45,0.55) 92%, transparent 100%);
  }
  .serve-label {
    position: absolute; right: 0; top: -30px; transform: translateX(50%);
    font-size: 14px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: #D3642D; font-family: 'JetBrains Mono', monospace; white-space: nowrap;
  }

  .cook-row {
    display: flex; align-items: center; margin-bottom: 14px;
  }
  .cook-row:last-child { margin-bottom: 0; }

  .bar-track {
    flex: 1; height: 100px; position: relative; display: flex; align-items: center;
  }
  .bar-spacer { flex-shrink: 0; }
  .bar-fill {
    flex: 1; height: 100px; border-radius: 8px;
    position: relative; display: flex; align-items: center;
    padding: 0 20px;
    justify-content: space-between;
  }

  .bar-brisket .bar-fill {
    background: linear-gradient(90deg, rgba(167,40,49,0.6) 0%, rgba(193,73,49,0.8) 50%, rgba(211,100,45,0.95) 100%);
  }
  .bar-ribs .bar-fill {
    background: linear-gradient(90deg, rgba(193,73,49,0.38) 0%, rgba(211,100,45,0.7) 100%);
  }
  .bar-chicken .bar-fill {
    background: linear-gradient(90deg, rgba(211,100,45,0.22) 0%, rgba(211,100,45,0.55) 100%);
  }

  .bar-name {
    font-size: 20px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(244,241,234,0.9);
  }
  .bar-right {
    display: flex; align-items: center; gap: 16px;
  }
  .bar-temp {
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600;
    color: rgba(244,241,234,0.85);
  }
  .bar-dot {
    position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: #D3642D; box-shadow: 0 0 14px rgba(211,100,45,0.8); z-index: 2;
    flex-shrink: 0;
  }

  /* ── Footer ── */
  .footer {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 1;
  }
  .tagline { font-size: 19px; font-weight: 400; color: rgba(244,241,234,0.35); }
  .tagline strong { font-weight: 600; color: rgba(244,241,234,0.55); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 34px; height: 34px; object-fit: contain; }
  .brand-name { font-size: 17px; font-weight: 600; color: rgba(244,241,234,0.55); letter-spacing: -0.01em; }
  .brand-name span { color: #D3642D; }
</style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-serve"></div>

  <div class="top">
    <p class="eyebrow">Multi-Cook</p>
    <h1 class="headline">brisket, ribs,<br>chicken.<br><span class="accent">all at the same time.</span></h1>
    <p class="sub">Set one serve time. It builds the schedule backwards so everything comes off the pit together.</p>
  </div>

  <div class="timeline">
    <div class="serve-line"></div>
    <span class="serve-label">serve</span>

    <div class="cook-row bar-brisket">
      <div class="bar-track">
        <div class="bar-spacer" style="width:0%"></div>
        <div class="bar-fill">
          <span class="bar-name">Brisket</span>
          <div class="bar-right">
            <span class="bar-temp">203°F</span>
            <div class="bar-dot"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="cook-row bar-ribs">
      <div class="bar-track">
        <div class="bar-spacer" style="width:58.3%"></div>
        <div class="bar-fill">
          <span class="bar-name">Ribs</span>
          <div class="bar-right">
            <span class="bar-temp">195°F</span>
            <div class="bar-dot"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="cook-row bar-chicken">
      <div class="bar-track">
        <div class="bar-spacer" style="width:75%"></div>
        <div class="bar-fill">
          <span class="bar-name">Chicken</span>
          <div class="bar-right">
            <span class="bar-temp">165°F</span>
            <div class="bar-dot"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="tagline"><strong>knowyourpit.</strong> own your cook.</span>
    <div class="brand">
      <img class="brand-icon" src="../icon-transparent-light.png" alt="">
      <span class="brand-name">know<span>your</span>pit</span>
    </div>
  </div>
</body>
</html>
