<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #131110;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; align-items: center;
    padding: 72px 96px;
  }
  .bg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 30% 50%, rgba(232,64,28,0.08) 0%, transparent 65%);
  }
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    gap: 0;
    max-width: 700px;
  }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #E8401C;
    margin-bottom: 24px;
  }
  .headline {
    font-size: 54px; font-weight: 700; line-height: 1.08;
    letter-spacing: -0.025em; color: #E8DFD4;
    margin-bottom: 28px;
  }
  .headline span { color: #E8401C; }
  .body {
    font-size: 19px; font-weight: 400; line-height: 1.6;
    color: rgba(232,223,212,0.55);
    max-width: 560px;
    margin-bottom: 48px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-icon { width: 34px; height: 34px; object-fit: contain; }
  .brand-name {
    font-size: 15px; font-weight: 600; color: rgba(232,223,212,0.7);
    letter-spacing: -0.01em;
  }
  .brand-name span { color: #E8401C; }
  .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(232,223,212,0.25);
  }
  .available {
    font-size: 13px; color: rgba(232,223,212,0.4);
    letter-spacing: 0.02em;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="content">
    <p class="eyebrow">Now available on iOS</p>
    <h1 class="headline">BBQ apps tell you<br>what's happening.<br><span>We tell you what to do.</span></h1>
    <p class="body">Connect your probe. Plan from cut to serve time. Run multiple proteins to the same table. No notes app, no guessing.</p>
    <div class="brand">
      <img class="brand-icon" src="../icon-transparent-light.png" alt="">
      <span class="brand-name">know <span>your</span> pit</span>
      <div class="dot"></div>
      <span class="available">Free on the App Store</span>
    </div>
  </div>
</body>
</html>
