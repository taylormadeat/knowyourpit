<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1702px; height: 630px; overflow: hidden;
    background: #131110;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .bg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 100% at 50% 50%, rgba(232,64,28,0.13) 0%, transparent 65%);
  }
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo { width: 480px; object-fit: contain; }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="content">
    <img class="logo" src="../logo.png" alt="know your pit">
  </div>
</body>
</html>
