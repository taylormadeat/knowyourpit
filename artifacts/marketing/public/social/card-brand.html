<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #131110;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .bg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(232,64,28,0.12) 0%, transparent 65%);
  }
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 36px;
  }
  .logo { width: 380px; object-fit: contain; }
  .tagline {
    font-size: 22px; font-weight: 400; letter-spacing: 0.01em;
    color: rgba(232,223,212,0.55);
  }
  .divider {
    width: 48px; height: 2px;
    background: linear-gradient(90deg, transparent, #E8401C, transparent);
    margin: 0 auto;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="content">
    <img class="logo" src="../logo.png" alt="know your pit">
    <div class="divider"></div>
    <p class="tagline">The AI BBQ coach. Now on iOS.</p>
  </div>
</body>
</html>
