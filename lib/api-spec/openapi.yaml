openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PitMaster AI - BBQ Planning & Monitoring API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: grills
    description: Grill profile management
  - name: cooks
    description: Cook session logging and management
  - name: temperature
    description: Temperature data upload and monitoring
  - name: ai
    description: AI assistant and predictions
  - name: dashboard
    description: Dashboard summary data
  - name: meater
    description: MEATER thermometer integration
  - name: thermoworks
    description: ThermoWorks Cloud thermometer integration
  - name: customMeatCuts
    description: User-defined custom meat cuts
  - name: techniquePresets
    description: DB-seeded cook technique presets per meat cut
  - name: userTechniquePresets
    description: User-created custom cooking style presets

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /grills:
    get:
      operationId: listGrills
      tags: [grills]
      summary: List all grill profiles
      responses:
        "200":
          description: List of grill profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grill"
    post:
      operationId: createGrill
      tags: [grills]
      summary: Create a new grill profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrillBody"
      responses:
        "201":
          description: Created grill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grill"

  /grills/{id}:
    get:
      operationId: getGrill
      tags: [grills]
      summary: Get a grill profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grill"
        "404":
          description: Not found
    patch:
      operationId: updateGrill
      tags: [grills]
      summary: Update a grill profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGrillBody"
      responses:
        "200":
          description: Updated grill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grill"
        "404":
          description: Not found
    delete:
      operationId: deleteGrill
      tags: [grills]
      summary: Delete a grill profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /grills/{id}/stats:
    get:
      operationId: getGrillStats
      tags: [grills]
      summary: Get cook stats for a specific grill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillStats"

  /custom-meat-cuts:
    get:
      operationId: listCustomMeatCuts
      tags: [customMeatCuts]
      summary: List all custom meat cuts for the authenticated user
      responses:
        "200":
          description: List of custom meat cuts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomMeatCut"
    post:
      operationId: createCustomMeatCut
      tags: [customMeatCuts]
      summary: Create a custom meat cut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomMeatCutBody"
      responses:
        "201":
          description: Created custom meat cut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomMeatCut"

  /custom-meat-cuts/{id}:
    patch:
      operationId: updateCustomMeatCut
      tags: [customMeatCuts]
      summary: Update a custom meat cut
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomMeatCutBody"
      responses:
        "200":
          description: Updated custom meat cut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomMeatCut"
        "404":
          description: Not found
    delete:
      operationId: deleteCustomMeatCut
      tags: [customMeatCuts]
      summary: Delete a custom meat cut
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /technique-presets:
    get:
      operationId: getTechniquePresets
      tags: [techniquePresets]
      summary: List cook technique presets
      description: Returns seeded technique presets. Pass an optional `cutName` query parameter to filter by meat cut.
      parameters:
        - name: cutName
          in: query
          required: false
          schema:
            type: string
          description: Filter presets to a specific meat cut name (e.g. "Baby Back Ribs").
      responses:
        "200":
          description: List of technique presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechniquePreset"

  /user-technique-presets:
    get:
      operationId: listUserTechniquePresets
      tags: [userTechniquePresets]
      summary: List the authenticated user's custom cooking style presets
      parameters:
        - name: cutName
          in: query
          required: false
          schema:
            type: string
          description: Filter presets to a specific meat cut name.
      responses:
        "200":
          description: List of user technique presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserTechniquePreset"
    post:
      operationId: createUserTechniquePreset
      tags: [userTechniquePresets]
      summary: Create a custom cooking style preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserTechniquePresetBody"
      responses:
        "201":
          description: Created preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTechniquePreset"

  /user-technique-presets/{id}:
    delete:
      operationId: deleteUserTechniquePreset
      tags: [userTechniquePresets]
      summary: Delete a user's custom cooking style preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /grills/{id}/fingerprint:
    get:
      operationId: getGrillFingerprint
      tags: [grills]
      summary: Get the learned per-grill calibration profile (fingerprint)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill fingerprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillFingerprint"
        "404":
          description: Grill not found

  /grills/{id}/insights:
    get:
      operationId: getGrillInsights
      tags: [grills]
      summary: Get the learned per-grill calibration profile (available to all authenticated users)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill learned pace insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillInsights"
        "404":
          description: Grill not found

  /grills/{id}/temperature-history:
    get:
      operationId: getGrillTemperatureHistory
      tags: [grills]
      summary: Get recent temperature readings grouped by cook for a specific grill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill temperature history grouped by cook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillTemperatureHistory"

  /cooks/technique-stats:
    get:
      operationId: getCookTechniqueStats
      tags: [cooks]
      summary: Get per-technique performance stats
      description: Returns per-cooking-technique aggregates (avg rating, cook count, top meat type) for techniques with at least 2 completed, rated cooks.
      responses:
        "200":
          description: Technique performance stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechniqueStatsItem"

  /cooks:
    get:
      operationId: listCooks
      tags: [cooks]
      summary: List all cook sessions
      parameters:
        - name: grillId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [planned, active, completed, cancelled, null]
      responses:
        "200":
          description: List of cook sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cook"
    post:
      operationId: createCook
      tags: [cooks]
      summary: Create a new cook session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCookBody"
      responses:
        "201":
          description: Created cook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cook"

  /cooks/{id}:
    get:
      operationId: getCook
      tags: [cooks]
      summary: Get a cook session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cook session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cook"
        "404":
          description: Not found
    patch:
      operationId: updateCook
      tags: [cooks]
      summary: Update a cook session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCookBody"
      responses:
        "200":
          description: Updated cook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cook"
        "404":
          description: Not found
    delete:
      operationId: deleteCook
      tags: [cooks]
      summary: Delete a cook session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cooks/{id}/checkins/schedule:
    get:
      operationId: getCookCheckinSchedule
      tags: [cooks]
      summary: Get the server-computed check-in schedule for a cook
      description: Returns the AI-plan-anchored check-in schedule derived from the cook's sequence data. This is the single source of truth for check-in timing — the mobile app uses these times when scheduling local notifications.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Computed check-in schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckinScheduleItem"
        "404":
          description: Cook not found

  /cooks/{id}/checkins:
    get:
      operationId: listCookCheckins
      tags: [cooks]
      summary: Get all check-ins for a cook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CookCheckin"
        "404":
          description: Cook not found
    post:
      operationId: createCookCheckin
      tags: [cooks]
      summary: Record a check-in response for a cook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCookCheckinBody"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookCheckin"
        "404":
          description: Cook not found

  /cooks/{id}/events:
    get:
      operationId: listCookEvents
      tags: [cooks]
      summary: Get all quick-log events for a cook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of cook events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CookLogEvent"
        "404":
          description: Cook not found
    post:
      operationId: createCookEvent
      tags: [cooks]
      summary: Log a quick event during an active cook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCookEventBody"
      responses:
        "201":
          description: Event logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookLogEvent"
        "404":
          description: Cook not found

  /cooks/{id}/events/{eventId}:
    delete:
      operationId: deleteCookEvent
      tags: [cooks]
      summary: Retract (delete) a specific cook event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Event deleted
        "404":
          description: Cook or event not found

  /cooks/{id}/health:
    get:
      operationId: getCookHealth
      tags: [cooks]
      summary: Get the computed health score for a cook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cook health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookHealthScore"
        "404":
          description: Cook not found

  /cooks/{id}/outlier-dismiss:
    post:
      operationId: dismissCookOutlier
      tags: [cooks]
      summary: Dismiss the outlier flag and restore this cook to grill fingerprint calculations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outlier flag dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Cook not found

  /cooks/{id}/live-activity:
    post:
      operationId: registerCookLiveActivity
      tags: [cooks]
      summary: Register or update an iOS Live Activity push token for a cook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterLiveActivityBody"
      responses:
        "200":
          description: Push token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveActivityRegistration"
        "404":
          description: Cook not found
    delete:
      operationId: endCookLiveActivity
      tags: [cooks]
      summary: End all Live Activities tracked for a cook (server stops pushing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Activities ended

  /temperature/scan-image:
    post:
      operationId: scanTemperatureImage
      tags: [temperature]
      summary: Scan an image for temperature readings using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemperatureScanImageBody"
      responses:
        "200":
          description: Extracted temperature readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureScanResult"

  /temperature/analyze-cook:
    post:
      operationId: analyzeCook
      tags: [temperature]
      summary: Analyze multiple cook images + notes to synthesize a cook timeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeCookBody"
      responses:
        "200":
          description: Cook analysis result with time-series data and events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeCookResult"

  /temperature/upload:
    post:
      operationId: uploadTemperatureData
      tags: [temperature]
      summary: Upload temperature data from thermometer apps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemperatureUploadBody"
      responses:
        "201":
          description: Uploaded temperature readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureUploadResult"

  /temperature/readings:
    get:
      operationId: listTemperatureReadings
      tags: [temperature]
      summary: Get temperature readings for a cook session
      parameters:
        - name: cookId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Temperature readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemperatureReading"

  /ai/home-insights:
    get:
      operationId: getHomeInsights
      tags: [ai]
      summary: Get the user's PitMaster Score and cook breakdown (no AI call — instant)
      responses:
        "200":
          description: PitMaster Score and breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeInsights"

  /ai/home-insights/tips:
    get:
      operationId: getHomeInsightsTips
      tags: [ai]
      summary: Get AI-generated coaching tips (Pro only — triggers OpenAI call on cache miss)
      responses:
        "200":
          description: AI coaching tips
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeInsightsTips"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

  /ai/predict:
    post:
      operationId: aiPredict
      tags: [ai]
      summary: Predict cook start and finish times based on grill and food history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPredictBody"
      responses:
        "200":
          description: Prediction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPredictResponse"

  /ai/multi-cook:
    post:
      operationId: aiMultiCook
      tags: [ai]
      summary: Sequence multiple cooks to all be ready at the same serve time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiCookBody"
      responses:
        "200":
          description: Multi-cook schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiCookResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-cooks:
    get:
      operationId: getRecentCooks
      tags: [dashboard]
      summary: Get recent cook sessions
      responses:
        "200":
          description: Recent cooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cook"

  /dashboard/temperature-history:
    get:
      operationId: getTemperatureHistory
      tags: [dashboard]
      summary: Get aggregated temperature history across all cooks
      responses:
        "200":
          description: Temperature history summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemperatureHistorySummary"

  /meater/link:
    post:
      operationId: linkMeater
      tags: [meater]
      summary: Link MEATER Cloud account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeaterLinkBody"
      responses:
        "200":
          description: Account linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterLinkedResponse"
        "401":
          description: Invalid MEATER credentials

  /meater/unlink:
    delete:
      operationId: unlinkMeater
      tags: [meater]
      summary: Unlink MEATER Cloud account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterLinkedResponse"

  /meater/status:
    get:
      operationId: getMeaterStatus
      tags: [meater]
      summary: Get MEATER link status and device list
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current MEATER status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterStatusResponse"

  /meater/readings:
    get:
      operationId: getMeaterReadings
      tags: [meater]
      summary: Get live readings from first active MEATER probe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Live probe readings (first active device only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterReadingsResponse"

  /thermoworks/link:
    post:
      operationId: linkThermoworks
      tags: [thermoworks]
      summary: Link ThermoWorks Cloud account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermoworksLinkBody"
      responses:
        "200":
          description: Account linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermoworksLinkedResponse"
        "401":
          description: Invalid ThermoWorks credentials

  /thermoworks/send-reset:
    post:
      operationId: sendThermoworksReset
      tags: [thermoworks]
      summary: Send a ThermoWorks Cloud password-reset email
      description: Calls Firebase sendOobCode with requestType PASSWORD_RESET. Always returns 204 even if the email is not found (mirrors Firebase enum-safe behaviour).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermoworksSendResetBody"
      responses:
        "204":
          description: Reset email dispatched (or email not found — indistinguishable by design)
        "400":
          description: Email field missing

  /thermoworks/unlink:
    delete:
      operationId: unlinkThermoworks
      tags: [thermoworks]
      summary: Unlink ThermoWorks Cloud account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermoworksLinkedResponse"

  /thermoworks/status:
    get:
      operationId: getThermoworksStatus
      tags: [thermoworks]
      summary: Get ThermoWorks link status and device list
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current ThermoWorks status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermoworksStatusResponse"

  /thermoworks/readings:
    get:
      operationId: getThermoworksReadings
      tags: [thermoworks]
      summary: Get live readings from active ThermoWorks probes
      security:
        - BearerAuth: []
      responses:
        "200":
