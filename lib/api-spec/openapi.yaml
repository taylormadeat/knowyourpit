    GrillFingerprint:
      type: object
      properties:
        grillId:
          type: integer
        cookCount:
          type: integer
          description: Number of completed cooks on this grill
        confidenceLevel:
          type: string
          enum: [none, building, developing, established]
        pitBiasF:
          type: ["number", "null"]
          description: Average pit temperature bias vs set point (positive = runs hot)
        overshootF:
          type: ["number", "null"]
          description: Average pull temperature overshoot vs target (positive = overshoots)
        durationByMeat:
          type: object
          additionalProperties:
