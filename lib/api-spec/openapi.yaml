              additionalProperties:
                type: string
          additionalProperties: true
        sizingLabel:
          type: ["string", "null"]
          description: Human-readable size label (e.g. "6 thighs · ≈ 2.4 lbs est." or "2 racks · ≈ 4.5 lbs est.")
        outlierDismissed:
          type: ["boolean", "null"]
          description: Set to true to dismiss the outlier flag and restore this cook to fingerprint calculations

    TemperatureReading:
      type: object
      properties:
        id:
          type: integer
        cookId:
          type: integer
        probeNumber:
          type: integer
        probeName:
          type: ["string", "null"]
        tempF:
          type: number
        recordedAt:
          type: string
          format: date-time
        source:
          type: string
          description: "manual, meater, thermoworks, inkbird, govee, csv"
      required:
        - id
        - cookId
        - probeNumber
        - probeName
        - tempF
        - recordedAt
        - source

    TemperatureScanImageBody:
      type: object
      properties:
        base64Image:
          type: string
          description: Base64-encoded image data (JPG, PNG, or WEBP)
        mimeType:
          type: string
          description: "MIME type of the image: image/jpeg, image/png, or image/webp"
          default: "image/jpeg"
      required:
        - base64Image

    TemperatureScanResult:
      type: object
      properties:
        readings:
          type: array
          items:
            $ref: "#/components/schemas/ScannedReading"
        cookDurationMinutes:
          type: ["integer", "null"]
          description: Total cook duration in minutes, or null if not determinable from the image
        noDataFound:
          type: boolean
          description: True when the image had no readable temperature data
        rawExtraction:
          type: ["string", "null"]
          description: Raw text extracted from the image before structuring
        detectedFoodType:
          type: ["string", "null"]
          description: Meat or food type detected from app labels, cook log text, or graph annotations in the image
        detectedCookDate:
          type: ["string", "null"]
          format: date-time
          description: Cook start date/time detected from the image (ISO 8601 UTC)
      required:
        - readings
        - noDataFound

    ScannedReading:
      type: object
      properties:
        probeName:
          type: string
          description: Probe label as shown in the image (e.g. "Probe 1", "Meat", "Pit", "Ambient")
        finishingTempF:
          type: number
          description: Final (finishing) temperature for this probe in Fahrenheit
        minTempF:
          type: ["number", "null"]
          description: Minimum temperature seen for this probe during the cook, or null if not determinable
        maxTempF:
          type: ["number", "null"]
          description: Maximum temperature seen for this probe during the cook, or null if not determinable
      required:
        - probeName
        - finishingTempF

    TemperatureUploadBody:
      type: object
      properties:
        cookId:
          type: integer
        source:
          type: string
          description: "meater, thermoworks, inkbird, govee, csv, manual"
        readings:
          type: array
          items:
            $ref: "#/components/schemas/TemperatureReadingInput"
      required:
        - cookId
        - source
        - readings

    TemperatureReadingInput:
      type: object
      properties:
        probeNumber:
          type: integer
        probeName:
          type: ["string", "null"]
        tempF:
          type: number
        recordedAt:
          type: string
          format: date-time
      required:
        - probeNumber
        - tempF
        - recordedAt

    TemperatureUploadResult:
      type: object
      properties:
        inserted:
          type: integer
        cookId:
          type: integer
      required:
        - inserted
        - cookId

    AnalyzeCookBody:
      type: object
      properties:
        images:
          type: array
          description: One or more thermometer/grill images from the cook (max 10)
          items:
            $ref: "#/components/schemas/AnalyzeCookImageInput"
        cookNotes:
          type: ["string", "null"]
          description: Optional free-text notes from the user about the cook
        cookId:
          type: ["integer", "null"]
          description: Optional cook ID — when provided, the analysis result is saved as a Pit Journal entry
        cookContext:
          type: ["object", "null"]
          description: Structured cook context for richer AI analysis
          properties:
            probeChannels:
              type: array
              description: All active probe channels from the connected LAN/BLE device (e.g. Fireboard, ThermoWorks Signals, MEATER Block)
              items:
                $ref: "#/components/schemas/ProbeChannelReading"
      required:
        - images

    ProbeChannelReading:
      type: object
      description: A single live channel reading from a multi-channel probe device
      properties:
        channelLabel:
          type: string
          description: Human-readable channel label (e.g. "Brisket Flat", "Channel 1", "Pit")
        probeTempF:
          type: number
          description: Current temperature reading for this channel in Fahrenheit
      required:
        - channelLabel
        - probeTempF

    AnalyzeCookImageInput:
      type: object
      properties:
        base64:
          type: string
          description: Base64-encoded image data
        mimeType:
          type: string
          description: "MIME type: image/jpeg, image/png, or image/webp"
          default: "image/jpeg"
      required:
        - base64

    AnalyzeCookResult:
      type: object
      properties:
        probes:
          type: array
          description: Per-probe summary and synthesized time-series
          items:
            $ref: "#/components/schemas/AnalyzedProbe"
        events:
          type: array
          description: Detected cook events such as wrap, stall, spike
          items:
            $ref: "#/components/schemas/CookEvent"
        cookDurationMinutes:
          type: ["integer", "null"]
          description: Total cook duration in minutes
        detectedFoodType:
          type: ["string", "null"]
        detectedCookDate:
          type: ["string", "null"]
          format: date-time
        noDataFound:
          type: boolean
        rawExtraction:
          type: ["string", "null"]
      required:
        - probes
        - events
        - noDataFound

    AnalyzedProbe:
      type: object
      properties:
        probeName:
          type: string
        finishingTempF:
          type: number
        minTempF:
          type: ["number", "null"]
        maxTempF:
          type: ["number", "null"]
        timeSeries:
          type: array
          description: Synthesized temperature readings over time
          items:
            $ref: "#/components/schemas/ProbeTimePoint"
      required:
        - probeName
        - finishingTempF
        - minTempF
        - maxTempF
        - timeSeries

    ProbeTimePoint:
      type: object
      properties:
        timeMinutes:
          type: number
          description: Minutes elapsed from cook start
        tempF:
          type: number
          description: Temperature at that point in Fahrenheit
      required:
        - timeMinutes
        - tempF

    CookEvent:
      type: object
      properties:
        type:
          type: string
          description: "wrap, stall, spike, done, note"
        timeMinutes:
          type: number
          description: Minutes from cook start when event occurred
        description:
          type: string
          description: Plain-English description of the event
      required:
        - type
        - timeMinutes
        - description

    TemperatureHistorySummary:
      type: object
      properties:
        cookId:
          type: integer
        foodType:
          type: string
        avgTempF:
          type: number
        maxTempF:
          type: number
        minTempF:
          type: number
        readingCount:
          type: integer
        cookedAt:
          type: string
          format: date-time
      required:
        - cookId
        - foodType
        - avgTempF
        - maxTempF
        - minTempF
        - readingCount
        - cookedAt

    AiChatBody:
      type: object
      properties:
        message:
          type: string
        context:
          type: ["string", "null"]
          description: Optional JSON context (active cook, selected grill, etc.)
      required:
        - message

    AiChatResponse:
      type: object
      properties:
        reply:
          type: string
        suggestions:
          type: array
          items:
            type: string
      required:
        - reply
        - suggestions

    AiPredictBody:
      type: object
      properties:
        grillId:
          type: ["integer", "null"]
        foodType:
          type: string
        weightLbs:
          type: ["number", "null"]
        cookTempF:
          type: ["number", "null"]
        targetTempF:
          type: ["number", "null"]
        desiredFinishAt:
          type: ["string", "null"]
          format: date-time
        preheatMinutes:
          type: ["integer", "null"]
          description: Minutes needed to start and bring the grill up to cook temperature
        outdoorTempF:
          type: ["number", "null"]
          description: Outdoor ambient temperature in Fahrenheit, used to adjust cook time estimates. May be either current conditions or a forecast for the cook day (see outdoorTempIsForecast).
        outdoorTempIsForecast:
          type: ["boolean", "null"]
          description: True when outdoorTempF is a forecasted value for the cook day (Pro). False or omitted when it is the current ambient temperature.
        fromFrozen:
          type: ["boolean", "null"]
          description: True when the meat is starting from a fully frozen state and needs to be thawed before cooking. PitMaster will factor in thaw timing, surface drying, and dry-brine adjustments.
        thawMethod:
          type: ["string", "null"]
          enum: [fridge, cold_water, microwave, counter, cook_from_frozen, null]
          description: Chosen thaw method when fromFrozen is true. "fridge" is slow and safest; "cold_water" is faster but requires more attention. Used to tailor PitMaster's thaw and surface-dry guidance.
        cookingMethod:
          type: ["string", "null"]
          description: Cooking technique chosen by the user (e.g. "Low & Slow", "Hot & Fast", "Rotisserie", "Reverse Sear"). Influences time estimate and wrap guidance.
        injection:
          type: ["string", "null"]
          description: Whether the meat is injected ("Injected" or "Not Injected"). Injected cuts retain more moisture and experience a shorter stall.
        spritzFrequency:
          type: ["string", "null"]
          description: How often the user plans to spritz/mop the meat during the cook (e.g. "No Spritz", "Every 30 min", "Every Hour", "Once at Stall"). Affects bark development and moisture retention.
        wrapFinish:
          type: ["string", "null"]
          description: User's intended wrap or finish method (e.g. "No Wrap", "Butcher Paper at Stall", "Foil at Stall (Texas Crutch)", "Foil Boat"). PitMaster should align wrap recommendation with this preference.
        meatStartTemp:
          type: ["string", "null"]
          description: Starting temperature state of the meat ("Cold from Fridge" or "Tempered to Room Temp"). Cold-from-fridge meat adds ~20–30 min to large cuts; tempered meat cooks at baseline pace.
        notes:
          type: ["string", "null"]
          description: Optional free-text cook notes from the user (e.g. wood choice, rub details, special instructions). PitMaster factors these into timing, technique, and tip recommendations.
        pieceCount:
          type: ["integer", "null"]
          description: Number of individual pieces or racks being cooked. Used to compute grill load density when the grill's cooking surface area is known.
        isIndividualCook:
          type: ["boolean", "null"]
          description: True when each piece cooks independently and additional pieces do not extend cook time (e.g. steaks, chops, sausage). False for large single-mass cuts where total weight drives cook time.
        sizingLabel:
          type: ["string", "null"]
          description: Human-readable size description chosen by the user (e.g. "6 thighs · ≈ 2.4 lbs est." or "2 racks · ≈ 4.5 lbs est."). Included in the prompt when provided.
        cookingStylePreset:
          type: ["string", "null"]
          description: Name of the preset style the user selected (e.g. "3-2-1 Method", "Texas Style (No Wrap)"). Mentioned in the prompt for context; the individual technique fields above already reflect its settings.
        cookId:
          type: ["integer", "null"]
          description: ID of an existing cook record. When present, the server patches the cook with AI refinement results (wrap times, check-in schedule, sequenceData) after responding.
        baselineSchedule:
          allOf:
            - $ref: "#/components/schemas/BaselineSchedule"
          nullable: true
          description: Deterministic schedule anchors computed by calcSchedule on the client before the AI call. Sent as context so PitMaster personalises rather than re-derives the full timeline from scratch.
      required:
        - foodType

    BaselineSchedule:
      type: object
      description: Deterministic cook schedule anchors computed from heuristic rules (calcSchedule). Sent alongside the AI predict request so PitMaster can focus on personalising rather than re-deriving the full timeline.
      properties:
        preheatStartAt:
          type: string
          format: date-time
          description: When to light/start the grill (before meat goes on)
        meatOnAt:
          type: string
          format: date-time
          description: When to put the meat on the grill
        wrapAt:
          type: ["string", "null"]
          format: date-time
          description: Estimated wrap time (null if the cut does not stall)
        wrapTempF:
          type: ["integer", "null"]
          description: Estimated internal temp at wrap (null if no wrap)
        pullAt:
          type: string
          format: date-time
          description: When to pull the meat off the grill
        restEndAt:
          type: string
          format: date-time
          description: End of rest period / serve time
        cookMins:
          type: integer
          description: Active cook time in minutes (meat-on to pull)
        preheatMins:
          type: integer
          description: Preheat time in minutes
        restMins:
          type: integer
          description: Rest time in minutes
      required:
        - preheatStartAt
        - meatOnAt
        - pullAt
        - restEndAt
        - cookMins
        - preheatMins
        - restMins

    WrapRecommendation:
      type: object
      properties:
        wrapAtMinutes:
          type: integer
          description: Minutes into the cook when meat should be wrapped
        method:
          type: string
          enum: [foil, butcher_paper, none]
          description: Recommended wrapping material
        wrapTempF:
          type: ["integer", "null"]
          description: Internal meat temp at which to wrap (if applicable)
        reason:
          type: string
          description: Why to wrap, how to do it, and what to expect
        restMinutes:
          type: integer
          description: Recommended rest time in minutes after pulling from grill
      required:
        - wrapAtMinutes
        - method
        - wrapTempF
        - reason
        - restMinutes

    AiCheckinItem:
      type: object
      description: A single AI-generated check-in step for a cook plan
      properties:
        offsetMinutes:
          type: number
          description: Minutes after meatOnAt when this check-in should fire
        label:
          type: string
          description: Short display label for this check-in phase (e.g. "Bark Lock", "Wrap Time")
        coachingNote:
          type: string
          description: Actionable instruction the pitmaster will act on at this moment
        visualCues:
          type: array
          items:
            type: string
          description: What to look for visually or physically when this check-in fires
        expectedInternalTempRange:
          type: ["array", "null"]
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: Expected [min, max] internal temp range at this check-in (null if not probe-based)
      required:
        - offsetMinutes
        - label
        - coachingNote
        - visualCues

    FactorBreakdownItem:
      type: object
      properties:
        label:
          type: string
          description: Short display label for this factor (e.g. "Base Cook Time", "Stall Allowance")
        minutes:
          type: integer
          description: Time contribution in minutes (always positive)
        colorHex:
          type: string
          description: Hex color string used to render this segment in the stacked bar
        description:
          type: string
          description: One-sentence explanation shown in the detail sheet
        icon:
          type: string
          description: Feather icon name for this factor
      required:
        - label
        - minutes
        - colorHex
        - description
        - icon

    AiPredictResponse:
      type: object
      properties:
        estimatedDurationMinutes:
          type: number
          description: Active cook time only (food on → off grill), excluding preheat and rest
        preheatMinutes:
          type: integer
          description: Minutes needed to start and bring the grill up to cook temperature
        grillLightAt:
          type: ["string", "null"]
          format: date-time
          description: When to light/start the grill, accounting for preheat time
        suggestedStartAt:
          type: ["string", "null"]
          format: date-time
          description: When to put food on the grill
        estimatedFinishAt:
          type: ["string", "null"]
          format: date-time
          description: When food comes off the grill (before rest)
        serveAt:
          type: ["string", "null"]
          format: date-time
          description: When food is ready to serve (after rest)
        wrap:
          $ref: "#/components/schemas/WrapRecommendation"
        confidence:
          type: string
          enum: [low, medium, high]
        rationale:
          type: string
        tips:
          type: array
          items:
            type: string
        checkins:
          type: array
          items:
            $ref: "#/components/schemas/AiCheckinItem"
          description: AI-generated check-in schedule tailored to this specific meat, technique, and cook plan. Each item fires at offsetMinutes after meatOnAt.
        fingerprintApplied:
          type: boolean
          description: True when the per-grill fingerprint adjusted the time estimate or note
        fingerprintNote:
          type: ["string", "null"]
          description: Human-readable note about how the grill's fingerprint was applied
        fingerprintSource:
          type: ["string", "null"]
          enum: [grill, user, pit_bias_only, null]
          description: Source of the fingerprint adjustment (per-grill learned pace, user-wide fallback, or pit bias only)
        recommendedServeAt:
          type: ["string", "null"]
          format: date-time
          description: When fromFrozen is true and the user's desiredFinishAt is too soon for a full thaw, PitMaster may suggest a later serve time that allows for proper thawing. Null when not applicable.
        recommendedServeReason:
          type: ["string", "null"]
          description: Human-readable explanation for the recommendedServeAt adjustment (e.g., why thawing requires more lead time).
        factorBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/FactorBreakdownItem"
          description: Ordered list of time-contribution factors explaining what drives the cook time estimate. Present when enough context exists to build a meaningful breakdown; absent for minimal-input requests. The first item is always the base cook time; subsequent items are identified add-ons (stall, grill load, cold weather, learned pace, thaw+temper).
        timedOut:
          type: boolean
          description: True when the AI prediction call timed out and a fallback estimate was used instead of a live AI response.
      required:
        - estimatedDurationMinutes
        - preheatMinutes
        - grillLightAt
        - suggestedStartAt
        - estimatedFinishAt
        - serveAt
        - wrap
        - confidence
        - rationale
        - fingerprintApplied
        - fingerprintNote
        - fingerprintSource
        - tips
        - checkins

    MultiCookItem:
      type: object
      properties:
        foodType:
          type: string
        weightLbs:
          type: ["number", "null"]
        cookTempF:
          type: ["number", "null"]
        targetTempF:
          type: ["number", "null"]
        grillId:
          type: ["integer", "null"]
        preheatMinutes:
          type: ["integer", "null"]
          description: Minutes to preheat the grill before putting meat on
        cookingMethod:
          type: ["string", "null"]
          description: Cooking technique selected by the user (e.g. "Low & Slow", "Hot & Fast", "Rotisserie"). When provided the AI should factor it into duration estimates, wrap recommendations, and notes.
        fromFrozen:
          type: ["boolean", "null"]
          description: True when this item is starting from a fully frozen state. PitMaster will factor in thaw lead-time when scheduling backwards from the serve time.
        thawMethod:
          type: ["string", "null"]
          enum: [fridge, cold_water, microwave, counter, cook_from_frozen, null]
          description: Chosen thaw method when fromFrozen is true. "fridge" is slow and safest (~24h / 4–5 lbs); "cold_water" is faster (~1h per lb).
        notes:
          type: ["string", "null"]
          description: Free-text notes specific to this item (rub recipe, wood choice, injection brine, special instructions). PitMaster factors these into timing and technique recommendations for this cut.
        cookingStylePreset:
          type: ["string", "null"]
          description: Name of the preset style the user selected for this item (e.g. "3-2-1 Method", "Texas Style"). Mentioned for context alongside the individual technique fields.
        grillName:
          type: ["string", "null"]
          description: Human-readable name of the grill assigned to this item (e.g. "Big Green Egg 2XL"). Used by the server to detect shared-grill scenarios and include per-grill calibration coaching.
      required:
        - foodType

    MultiCookBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MultiCookItem"
          minItems: 1
          maxItems: 5
        serveAt:
          type: string
          format: date-time
          description: Target time when all food should be ready to serve.
        outdoorTempF:
          type: ["number", "null"]
          description: Outdoor ambient temperature in Fahrenheit. May be current conditions or a forecast for the cook day (see outdoorTempIsForecast).
        outdoorTempIsForecast:
          type: ["boolean", "null"]
          description: True when outdoorTempF is a forecasted value for the cook day (Pro). False or omitted when it is the current ambient temperature.
        notes:
          type: ["string", "null"]
          description: Optional session-level free-text notes (e.g. wood choice, rub, special instructions). PitMaster factors these into timing and tips for all items in the session.
      required:
        - items
        - serveAt

    MultiCookScheduleItem:
      type: object
      properties:
        foodType:
          type: string
        estimatedDurationMinutes:
          type: integer
          description: Active cook time only (meat on grill to off grill), excluding preheat and rest
        preheatMinutes:
          type: integer
        restMinutes:
          type: integer
          description: Recommended rest time after pulling from grill
        grillLightAt:
          type: string
          format: date-time
          description: When to light/start the grill
        meatOnAt:
          type: string
          format: date-time
          description: When to place the meat on the grill
        estimatedFinishAt:
          type: string
          format: date-time
          description: When meat comes off the grill (before rest)
        wrapMethod:
          type: ["string", "null"]
          enum: ["foil", "butcher_paper", "none", null]
          description: How to wrap this item during the cook ("foil", "butcher_paper", or "none")
        wrapAtMinutes:
          type: ["integer", "null"]
          description: Minutes from meatOnAt when to wrap (null or 0 if wrapMethod is "none")
        wrapTempF:
          type: ["integer", "null"]
          description: Internal meat temperature in °F at which to trigger the wrap (null if not applicable)
        wrapReason:
          type: ["string", "null"]
          description: One sentence explaining the wrap strategy for this item
        notes:
          type: string
          description: One sentence of specific advice for this item
        isSharedGrillFollowOn:
          type: ["boolean", "null"]
          description: True when this item shares a grill with an earlier item in the schedule. When true the UI should suppress the "Light grill" step and show "Grill already hot · add meat" instead.
