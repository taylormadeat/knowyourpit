      properties:
        id:
          type: integer
        grillId:
          type: ["integer", "null"]
        grillName:
          type: ["string", "null"]
        foodType:
          type: string
        weightLbs:
          type: ["number", "null"]
        targetTempF:
          type: ["number", "null"]
        cookTempF:
          type: ["number", "null"]
        status:
          type: string
          enum: [planned, active, completed, cancelled]
        plannedStartAt:
          type: ["string", "null"]
          format: date-time
        actualStartAt:
          type: ["string", "null"]
          format: date-time
        plannedEndAt:
          type: ["string", "null"]
          format: date-time
        actualEndAt:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        preheatMinutes:
          type: ["integer", "null"]
          description: Minutes needed to start and bring the grill up to cook temperature
        wrapAtMinutes:
          type: ["integer", "null"]
          description: Minutes into the cook when meat should be wrapped
        wrapMethod:
          type: ["string", "null"]
          enum: [foil, butcher_paper, none, null]
          description: Wrapping method recommended
        wrapTempF:
          type: ["integer", "null"]
          description: Internal meat temp at which to wrap
        wrapReason:
          type: ["string", "null"]
          description: Explanation of why and how to wrap
        restMinutes:
          type: ["integer", "null"]
          description: Recommended rest time after pulling from grill
        ratingTenderness:
          type: ["integer", "null"]
          description: 1-5 rating for meat tenderness
        ratingBark:
          type: ["integer", "null"]
          description: 1-5 rating for bark/crust/exterior color
        ratingFlavor:
          type: ["integer", "null"]
          description: 1-5 rating for overall flavor
        rating:
          type: ["integer", "null"]
          description: Overall score (1-5), computed as average of sub-ratings
        sessionId:
          type: ["string", "null"]
          description: UUID grouping cooks that were saved together from the Multi-Cook Sequencer
        confirmedSteps:
          type: ["object", "null"]
          additionalProperties:
            type: string
          description: Map of step keys to ISO timestamps of when the user confirmed each step
        fromFrozen:
          type: boolean
          description: True when this cook was planned starting from frozen meat (Frozen-to-Table mode)
        thawMethod:
          type: ["string", "null"]
          enum: [fridge, cold_water, microwave, counter, cook_from_frozen, null]
          description: Selected thaw method when fromFrozen is true
        actualThawStartAt:
          type: ["string", "null"]
          format: date-time
          description: The actual timestamp when the pitmaster moved the meat to begin thawing. Null until the pitmaster taps "Mark Thaw Started".
        cookingMethod:
          type: ["string", "null"]
          description: Cooking technique used (e.g. Low & Slow, Hot & Fast, Rotisserie)
        injection:
          type: ["string", "null"]
          description: Injection technique used (e.g. Not Injected, Injected)
        spritzFrequency:
          type: ["string", "null"]
          description: How often the cook was spritzed/mopped (e.g. Every Hour, No Spritz)
        wrapFinish:
          type: ["string", "null"]
          description: Wrap or finish method used (e.g. Butcher Paper at Stall, No Wrap)
        finishTimeRangeLower:
          type: ["string", "null"]
          format: date-time
          description: Lower bound of the finish time confidence range
        finishTimeRangeUpper:
          type: ["string", "null"]
          format: date-time
          description: Upper bound of the finish time confidence range
        healthScore:
          type: ["string", "null"]
          description: Cook health letter grade (A, B, C, D, F)
        healthScoreReason:
          type: ["string", "null"]
          description: One-line explanation of the health score
        currentTempF:
          type: ["number", "null"]
          description: Latest internal probe temperature reading for this cook (null when no readings exist)
        probeAssignments:
          type: ["object", "null"]
          description: Server-persisted probe assignments and labels for this cook
          properties:
            meatProbes:
              type: array
              description: Ordered meat probe slots. First entry is the primary doneness probe. Absent on records written before multi-probe support (use meatProbeId for those).
              items:
                type: object
                properties:
                  id:
                    type: string
                  label:
                    type: string
                required: [id, label]
            meatProbeId:
              type: ["string", "null"]
              description: Legacy v1 field — equals meatProbes[0].id. Written alongside meatProbes for backwards compatibility.
            pitProbeId:
              type: ["string", "null"]
            labels:
              type: object
              additionalProperties:
                type: string
          additionalProperties: true
        sizingLabel:
          type: ["string", "null"]
          description: Human-readable size label saved at planning/log time (e.g. "6 thighs · ≈ 2.4 lbs est." or "2 racks · ≈ 4.5 lbs est.")
        isOutlier:
          type: boolean
          description: True when the cook was auto-detected as an outlier on completion (missing check-ins and/or large duration deviation)
        outlierDismissed:
          type: boolean
          description: True when the user has manually marked this cook as accurate, overriding the outlier flag
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - grillId
        - grillName
        - foodType
        - weightLbs
        - targetTempF
        - cookTempF
        - status
        - plannedStartAt
        - actualStartAt
        - plannedEndAt
        - actualEndAt
        - notes
