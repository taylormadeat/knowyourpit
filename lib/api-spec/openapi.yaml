    Grill:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: "charcoal, gas, pellet, electric, smoker, kamado, offset, etc."
        fuelType:
          type: ["string", "null"]
          description: "charcoal, propane, natural gas, wood pellet, electric, wood, etc."
        brand:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
