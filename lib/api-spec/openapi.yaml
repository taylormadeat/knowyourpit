    CookHealthScore:
      type: object
      properties:
        cookId:
          type: integer
        grade:
          type: ["string", "null"]
          description: "Letter grade: A, B, C, D, or F — null when the cook is flagged as an outlier pending review"
          enum: [A, B, C, D, F, null]
        reason:
          type: string
          description: One-line plain-English explanation of the grade
        factors:
          type: object
          description: Breakdown of individual score contributors
          properties:
            tempTracking:
              type: string
              description: How well internal temps are tracking the expected range
            stepTiming:
              type: string
              description: How on-time confirmed step completions are
            issueCount:
              type: integer
              description: Number of flagged issues (flare-ups, stalls, drifts)
            stallDetected:
              type: boolean
              description: Whether an extended stall was detected
            pitDrift:
              type: boolean
              description: Whether significant pit temperature drift was detected
            aiVerdict:
              type: string
              nullable: true
              description: AI assessment verdict (perfect, good, needs_work, overcooked, undercooked)
            planAccuracyScore:
              type: integer
              nullable: true
              description: Plan adherence score 0-100
          required:
            - issueCount
            - stallDetected
            - pitDrift
        computedAt:
          type: string
          format: date-time
      required:
        - cookId
        - grade
        - reason
        - factors
        - computedAt
