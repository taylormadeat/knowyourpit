openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PitMaster AI - BBQ Planning & Monitoring API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: grills
    description: Grill profile management
  - name: cooks
    description: Cook session logging and management
  - name: recipes
    description: Recipe storage and management
  - name: temperature
    description: Temperature data upload and monitoring
  - name: ai
    description: AI assistant and predictions
  - name: forum
    description: Community forum posts and comments
  - name: tips
    description: Cooking tips
  - name: alerts
    description: Temperature alerts
  - name: dashboard
    description: Dashboard summary data
  - name: meater
    description: MEATER thermometer integration
  - name: thermoworks
    description: ThermoWorks Cloud thermometer integration
  - name: customMeatCuts
    description: User-defined custom meat cuts

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /grills:
    get:
      operationId: listGrills
      tags: [grills]
      summary: List all grill profiles
      responses:
        "200":
          description: List of grill profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grill"
    post:
      operationId: createGrill
      tags: [grills]
      summary: Create a new grill profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrillBody"
      responses:
        "201":
          description: Created grill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grill"

  /grills/{id}:
    get:
      operationId: getGrill
      tags: [grills]
      summary: Get a grill profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grill"
        "404":
          description: Not found
    patch:
      operationId: updateGrill
      tags: [grills]
      summary: Update a grill profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGrillBody"
      responses:
        "200":
          description: Updated grill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grill"
        "404":
          description: Not found
    delete:
      operationId: deleteGrill
      tags: [grills]
      summary: Delete a grill profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /grills/{id}/stats:
    get:
      operationId: getGrillStats
      tags: [grills]
      summary: Get cook stats for a specific grill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillStats"

  /custom-meat-cuts:
    get:
      operationId: listCustomMeatCuts
      tags: [customMeatCuts]
      summary: List all custom meat cuts for the authenticated user
      responses:
        "200":
          description: List of custom meat cuts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomMeatCut"
    post:
      operationId: createCustomMeatCut
      tags: [customMeatCuts]
      summary: Create a custom meat cut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomMeatCutBody"
      responses:
        "201":
          description: Created custom meat cut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomMeatCut"

  /custom-meat-cuts/{id}:
    patch:
      operationId: updateCustomMeatCut
      tags: [customMeatCuts]
      summary: Update a custom meat cut
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomMeatCutBody"
      responses:
        "200":
          description: Updated custom meat cut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomMeatCut"
        "404":
          description: Not found
    delete:
      operationId: deleteCustomMeatCut
      tags: [customMeatCuts]
      summary: Delete a custom meat cut
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /grills/{id}/fingerprint:
    get:
      operationId: getGrillFingerprint
      tags: [grills]
      summary: Get the learned per-grill calibration profile (fingerprint)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill fingerprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillFingerprint"
        "404":
          description: Grill not found

  /grills/{id}/temperature-history:
    get:
      operationId: getGrillTemperatureHistory
      tags: [grills]
      summary: Get recent temperature readings grouped by cook for a specific grill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grill temperature history grouped by cook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillTemperatureHistory"

  /cooks:
    get:
      operationId: listCooks
      tags: [cooks]
      summary: List all cook sessions
      parameters:
        - name: grillId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [planned, active, completed, cancelled, null]
      responses:
        "200":
          description: List of cook sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cook"
    post:
      operationId: createCook
      tags: [cooks]
      summary: Create a new cook session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCookBody"
      responses:
        "201":
          description: Created cook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cook"

  /cooks/{id}:
    get:
      operationId: getCook
      tags: [cooks]
      summary: Get a cook session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cook session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cook"
        "404":
          description: Not found
    patch:
      operationId: updateCook
      tags: [cooks]
      summary: Update a cook session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCookBody"
      responses:
        "200":
          description: Updated cook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cook"
        "404":
          description: Not found
    delete:
      operationId: deleteCook
      tags: [cooks]
      summary: Delete a cook session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: List all recipes
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Create a new recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeBody"
      responses:
        "201":
          description: Created recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"

  /recipes/{id}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get a recipe by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
    patch:
      operationId: updateRecipe
      tags: [recipes]
      summary: Update a recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeBody"
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
    delete:
      operationId: deleteRecipe
      tags: [recipes]
      summary: Delete a recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /recipes/{id}/favorite:
    patch:
      operationId: toggleRecipeFavorite
      tags: [recipes]
      summary: Toggle recipe favorite status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"

  /temperature/scan-image:
    post:
      operationId: scanTemperatureImage
      tags: [temperature]
      summary: Scan an image for temperature readings using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemperatureScanImageBody"
      responses:
        "200":
          description: Extracted temperature readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureScanResult"

  /temperature/analyze-cook:
    post:
      operationId: analyzeCook
      tags: [temperature]
      summary: Analyze multiple cook images + notes to synthesize a cook timeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeCookBody"
      responses:
        "200":
          description: Cook analysis result with time-series data and events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeCookResult"

  /temperature/upload:
    post:
      operationId: uploadTemperatureData
      tags: [temperature]
      summary: Upload temperature data from thermometer apps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemperatureUploadBody"
      responses:
        "201":
          description: Uploaded temperature readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureUploadResult"

  /temperature/readings:
    get:
      operationId: listTemperatureReadings
      tags: [temperature]
      summary: Get temperature readings for a cook session
      parameters:
        - name: cookId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Temperature readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemperatureReading"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

  /ai/predict:
    post:
      operationId: aiPredict
      tags: [ai]
      summary: Predict cook start and finish times based on grill and food history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPredictBody"
      responses:
        "200":
          description: Prediction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPredictResponse"

  /ai/multi-cook:
    post:
      operationId: aiMultiCook
      tags: [ai]
      summary: Sequence multiple cooks to all be ready at the same serve time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiCookBody"
      responses:
        "200":
          description: Multi-cook schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiCookResponse"

  /forum/posts:
    get:
      operationId: listForumPosts
      tags: [forum]
      summary: List forum posts
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of forum posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumPost"
    post:
      operationId: createForumPost
      tags: [forum]
      summary: Create a forum post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForumPostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"

  /forum/posts/{id}:
    get:
      operationId: getForumPost
      tags: [forum]
      summary: Get a forum post with its comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Forum post with comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPostDetail"
        "404":
          description: Not found

  /forum/posts/{id}/like:
    patch:
      operationId: likeForumPost
      tags: [forum]
      summary: Like a forum post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"

  /forum/posts/{id}/comments:
    post:
      operationId: createForumComment
      tags: [forum]
      summary: Add a comment to a forum post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForumCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumComment"

  /tips:
    get:
      operationId: listTips
      tags: [tips]
      summary: Get cooking tips
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of tips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CookingTip"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List temperature alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a temperature alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertBody"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    patch:
      operationId: patchAlert
      tags: [alerts]
      summary: Update an alert (mark triggered or store scheduled notification ID)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAlertBody"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-cooks:
    get:
      operationId: getRecentCooks
      tags: [dashboard]
      summary: Get recent cook sessions
      responses:
        "200":
          description: Recent cooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cook"

  /dashboard/temperature-history:
    get:
      operationId: getTemperatureHistory
      tags: [dashboard]
      summary: Get aggregated temperature history across all cooks
      responses:
        "200":
          description: Temperature history summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemperatureHistorySummary"

  /meater/link:
    post:
      operationId: linkMeater
      tags: [meater]
      summary: Link MEATER Cloud account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeaterLinkBody"
      responses:
        "200":
          description: Account linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterLinkedResponse"
        "401":
          description: Invalid MEATER credentials

  /meater/unlink:
    delete:
      operationId: unlinkMeater
      tags: [meater]
      summary: Unlink MEATER Cloud account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterLinkedResponse"

  /meater/status:
    get:
      operationId: getMeaterStatus
      tags: [meater]
      summary: Get MEATER link status and device list
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current MEATER status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterStatusResponse"

  /meater/readings:
    get:
      operationId: getMeaterReadings
      tags: [meater]
      summary: Get live readings from first active MEATER probe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Live probe readings (first active device only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeaterReadingsResponse"

  /thermoworks/link:
    post:
      operationId: linkThermoworks
      tags: [thermoworks]
      summary: Link ThermoWorks Cloud account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermoworksLinkBody"
      responses:
        "200":
          description: Account linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermoworksLinkedResponse"
        "401":
          description: Invalid ThermoWorks credentials

  /thermoworks/unlink:
    delete:
      operationId: unlinkThermoworks
      tags: [thermoworks]
      summary: Unlink ThermoWorks Cloud account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermoworksLinkedResponse"

  /thermoworks/status:
    get:
      operationId: getThermoworksStatus
      tags: [thermoworks]
      summary: Get ThermoWorks link status and device list
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current ThermoWorks status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermoworksStatusResponse"

  /thermoworks/readings:
    get:
      operationId: getThermoworksReadings
      tags: [thermoworks]
      summary: Get live readings from active ThermoWorks probes
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Live probe readings across all active ThermoWorks channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermoworksReadingsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Grill:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: "charcoal, gas, pellet, electric, smoker, kamado, offset, etc."
        fuelType:
          type: ["string", "null"]
          description: "charcoal, propane, natural gas, wood pellet, electric, wood, etc."
        brand:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        cookingSurfaceSqIn:
          type: ["number", "null"]
        minTempF:
          type: ["number", "null"]
        maxTempF:
          type: ["number", "null"]
        numProbes:
          type: ["integer", "null"]
        heatZones:
          type: ["integer", "null"]
        wifiEnabled:
          type: ["boolean", "null"]
        hopperSizeLbs:
          type: ["number", "null"]
        tempRange:
          type: ["string", "null"]
          description: "Human-readable temp range (e.g. '165°F – 500°F')"
        features:
          type: ["array", "null"]
          items:
            type: string
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        totalCooks:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - brand
        - model
        - description
        - cookingSurfaceSqIn
        - minTempF
        - maxTempF
        - numProbes
        - heatZones
        - wifiEnabled
        - hopperSizeLbs
        - tempRange
        - features
        - notes
        - imageUrl
        - totalCooks
        - createdAt
        - updatedAt

    CreateGrillBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        fuelType:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        cookingSurfaceSqIn:
          type: ["number", "null"]
        minTempF:
          type: ["number", "null"]
        maxTempF:
          type: ["number", "null"]
        numProbes:
          type: ["integer", "null"]
        heatZones:
          type: ["integer", "null"]
        wifiEnabled:
          type: ["boolean", "null"]
        hopperSizeLbs:
          type: ["number", "null"]
