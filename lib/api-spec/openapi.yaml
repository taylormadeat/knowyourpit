components:
  schemas:
    TechniquePreset:
      type: object
      description: A seeded cook technique preset for a specific meat cut. Selecting a preset auto-fills all technique quick-picks without calling AI.
      properties:
        id:
          type: integer
        cutName:
          type: string
          description: The meat cut name this preset applies to (matches MEAT_CUTS names exactly).
        label:
          type: string
          description: Human-readable preset name shown to the user (e.g. "3-2-1 Method", "Texas Style (No Wrap)").
        cookMethod:
          type: ["string", "null"]
          description: Cooking method value matching a QP_COOK_METHODS option.
        wrapFinish:
          type: ["string", "null"]
          description: Wrap/finish method value matching a QP_WRAP_FINISH_OPTIONS option.
        spritzFrequency:
          type: ["string", "null"]
          description: Spritz cadence value matching a QP_SPRITZ_FREQUENCIES option.
        injection:
          type: ["string", "null"]
          description: Injection option value matching a QP_INJECTION_OPTIONS option.
        cookTempF:
          type: ["integer", "null"]
          description: Suggested pit temperature in °F for this style (overrides cut default when non-null).
        targetTempF:
          type: ["integer", "null"]
          description: Suggested target internal temperature in °F for this style (overrides cut default when non-null).
        sortOrder:
          type: integer
          description: Display order among presets for the same cut (ascending).
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - cutName
        - label
        - sortOrder
        - createdAt

    UserTechniquePreset:
      type: object
      description: A user-created custom cooking style preset.
      properties:
        id:
          type: integer
        userId:
          type: string
        cutName:
          type: string
          description: The meat cut name this preset applies to.
        label:
          type: string
          description: User-given name for this preset (e.g. "My Overnight Style").
        cookMethod:
          type: ["string", "null"]
        wrapFinish:
          type: ["string", "null"]
        spritzFrequency:
          type: ["string", "null"]
        injection:
          type: ["string", "null"]
        cookTempF:
          type: ["integer", "null"]
        targetTempF:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - cutName
        - label
        - createdAt

    CreateUserTechniquePresetBody:
      type: object
