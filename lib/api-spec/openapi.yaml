          type: ["number", "null"]
        minTempF:
          type: ["number", "null"]
        maxTempF:
          type: ["number", "null"]
        numProbes:
          type: ["integer", "null"]
        heatZones:
          type: ["integer", "null"]
        wifiEnabled:
          type: ["boolean", "null"]
        hopperSizeLbs:
          type: ["number", "null"]
        tempRange:
          type: ["string", "null"]
          description: "Human-readable temp range (e.g. '165°F – 500°F')"
        features:
          type: ["array", "null"]
          items:
            type: string
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        totalCooks:
          type: integer
        cookCount:
          type: integer
          description: Number of cooks logged on this grill (returned by list endpoint)
        completedCookCount:
          type: integer
          description: Number of cooks with status=completed on this grill
        avgRating:
          type: ["number", "null"]
          description: Average overall rating across rated cooks on this grill
        lastCookAt:
          type: ["string", "null"]
          format: date-time
          description: Most recent actualStartAt of any completed cook on this grill
        totalHours:
          type: ["number", "null"]
          description: Total hours of completed cooks logged on this grill
        mostCookedFood:
          type: ["string", "null"]
          description: Food type most frequently cooked on this grill
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - brand
        - model
        - description
        - cookingSurfaceSqIn
        - minTempF
        - maxTempF
        - numProbes
        - heatZones
        - wifiEnabled
        - hopperSizeLbs
        - tempRange
        - features
        - notes
        - imageUrl
        - totalCooks
        - createdAt
        - updatedAt

