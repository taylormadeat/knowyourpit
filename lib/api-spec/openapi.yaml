    GrillStats:
      type: object
      properties:
        grillId:
          type: integer
        totalCooks:
          type: integer
        totalHours:
          type: number
        avgCookDurationMinutes:
          type: number
        mostCookedFood:
          type: ["string", "null"]
        avgTargetTempF:
          type: ["number", "null"]
        avgPitTempF:
          type: ["number", "null"]
          description: Average achieved pit/ambient temperature across all readings
        pitTempVarianceF:
          type: ["number", "null"]
          description: Average per-cook spread between max and min pit readings
        probeHighTempF:
          type: ["number", "null"]
          description: Highest probe (meat) temp recorded on this grill
