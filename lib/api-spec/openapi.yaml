        - mostCookedFood
        - avgTargetTempF
        - avgPitTempF
        - pitTempVarianceF
        - probeHighTempF
        - totalReadings

    GrillFingerprintDurationPattern:
      type: object
      properties:
        actualMinsPerLb:
          type: integer
        baselineMinsPerLb:
          type: ["integer", "null"]
        sampleSize:
          type: integer
        pctDiff:
          type: ["integer", "null"]
          description: Percent difference vs baseline (positive = slower than baseline)
      required:
        - actualMinsPerLb
        - baselineMinsPerLb
        - sampleSize
